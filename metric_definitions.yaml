      - Loss from Associates

  - canonical_name: Bank charges
    input_type: direct
    metric_type: absolute
    statement_type: Income Statement
    is_mentioned: false
    synonyms:
      - Bank charges
      - Bank fees
      - Banking charges

  - canonical_name: Write-off of financial assets
    input_type: direct
    metric_type: absolute
    statement_type: Income Statement
    is_mentioned: false
    synonyms:
      - Write-off of financial assets
