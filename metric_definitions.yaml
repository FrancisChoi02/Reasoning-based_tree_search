  - canonical_name: Taxation
    input_type: direct
    metric_type: absolute
    statement_type: Income Statement
    is_mentioned: false
    synonyms:
      - Taxation
      - Income Tax Expense
      - Income Tax
      - Tax Charge
      - Current Tax

  - canonical_name: Extraordinary items
    input_type: direct
    metric_type: absolute
    statement_type: Income Statement
    is_mentioned: false
    synonyms:
      - Extraordinary items
      - Exceptional items
      - Extraordinary revenues
      - Extraordinary expenses
      - Non-recurring items

  - canonical_name: Net Profit
    input_type: derived_else_direct
    metric_type: absolute
    statement_type: Income Statement
    is_mentioned: true
    component_metrics:
      - Operating Profit
      - Interest Received
      - Income from Investments
      - Interest Paid
      - Loss from Investments
      - Bank charges
      - Write-off of financial assets
      - Taxation
      - Extraordinary items
    formula_note: Operating Profit + Interest Received + Income from Investments - Interest Paid - Loss from Investments - Bank charges - Write-off of financial assets - Taxation - Extraordinary items
    derivation_code:
      formula: Operating Profit + Interest Received + Income from Investments - Interest Paid - Loss from Investments - Bank charges - Write-off of financial assets - Taxation - Extraordinary items
      components:
        - Operating Profit
        - Interest Received
        - Income from Investments
        - Interest Paid
        - Loss from Investments
        - Bank charges
        - Write-off of financial assets
        - Taxation
        - Extraordinary items
    synonyms:
      - Net Profit
      - Net Loss
      - Profit for the Year
      - Bottom Line
      - Net Income
