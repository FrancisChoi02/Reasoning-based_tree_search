    metric_type: absolute
    statement_type: Income Statement
    is_mentioned: true
    component_metrics:
      - Gross Profit
      - other Operating income
      - all Operating costs
      - Depreciation
      - Amortization
    formula_note: Gross Profit + other Operating income - all Operating costs - Depreciation - Amortization
    derivation_code:
      formula: Gross Profit + other Operating income - all Operating costs - Depreciation - Amortization
      components:
        - Gross Profit
        - other Operating income
        - all Operating costs
        - Depreciation
        - Amortization
    synonyms:
      - Operating Profit
      - Operating Loss
      - EBIT
      - Profit from Operations
      - Operating Income
      - Profit (loss) from operating activities

  - canonical_name: Operating Profit Margin %
    input_type: derived_else_direct
    metric_type: margin
    statement_type: Income Statement
    is_mentioned: true
    component_metrics:
      - Operating Profit
      - Revenue
    formula_note: (Operating Profit / Revenue) * 100
    derivation_code:
      formula: (Operating Profit / Revenue) * 100
      components:
        - Operating Profit
        - Revenue

  - canonical_name: Income from Investments
    input_type: direct
    metric_type: absolute
    statement_type: Income Statement
    is_mentioned: false
